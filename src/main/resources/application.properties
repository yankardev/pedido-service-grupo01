spring.application.name=pedido-service-grupo01
server.port=8071

# --- Config Server (lo implementa el integrante 5) ---
# "optional:" permite que esta app arranque igual si el config-server
# todavia no esta corriendo (util mientras cada quien prueba su parte
# por separado). Una vez el config-server este activo, estas propiedades
# se sobreescriben con las que vengan de GitHub (perfil dev).
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.profile=dev

# --- Eureka (lo implementa el integrante 1: discovery-server) ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- Actuator: habilita el endpoint /actuator/refresh que pide el enunciado ---
management.endpoints.web.exposure.include=refresh,health,info

# --- Valores por defecto de ecom.* ---
# Estos son solo un "respaldo" local para poder probar /api/v1/pedidos/configuracion
# ANTES de que el config-server este funcionando. Cuando el config-server
# conecte correctamente, los valores reales vienen desde GitHub
# (pedido-service-dev.properties) y reemplazan a estos.
ecom.impuesto-igv=0.18
ecom.monto-minimo-envio-gratis=150.00
ecom.mensaje-bienvenida=Entorno LOCAL (config-server aun no conectado) - Grupo 01
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_dev_db
