
spring.application.name=pedido-service-grupo01
server.port=8071

# Config Server
spring.config.import=configserver:http://localhost:8888
spring.cloud.config.name=pedido-service
spring.cloud.config.profile=dev

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=refresh,health,info

# Valores de respaldo local
ecom.impuesto-igv=0.18
ecom.monto-minimo-envio-gratis=150.00
ecom.mensaje-bienvenida=Entorno LOCAL - Grupo 01
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_dev_db
